name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck (no errors allowed)
        run: npx tsc --noEmit
      # Warnings are tolerated for now, errors never are (the old `|| true` hid both).
      - name: Lint (errors fail the build)
        run: npm run lint -- --max-warnings=200
      - name: Tests
        run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
