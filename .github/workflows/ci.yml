name: Verify local-first app

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (no warnings allowed)
        run: npm run lint -- --max-warnings=0
      - name: Unit and contract tests
        run: npm test
      - name: Android source contract
        run: npm run check:android
      - name: Build browser app
        run: npm run build
      - name: Build and verify the actual APK web bundle
        run: npm run bundle
      - name: Dependency audit
        run: npm audit --audit-level=moderate
