name: Build DON MUSE APK

on:
  push:
    branches: [main, "arena/**"]
    paths: ["android/**", "src/**", "public/**", "index.html", "package*.json", "vite.config.ts", "tsconfig.json", "scripts/check-android.mjs", ".github/workflows/android-apk.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the main-only rolling release step; branch/PR builds upload artifacts

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Compile and bundle the local UI (fail closed)
        env:
          VITE_BASE_PATH: "./"
        run: npm run bundle
      - uses: android-actions/setup-android@v4
      - name: Validate committed Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Configure release signing before Gradle runs
        id: signing
        env:
          DONMUSE_KEYSTORE_B64: ${{ secrets.DONMUSE_KEYSTORE_B64 }}
          DONMUSE_STORE_PASSWORD: ${{ secrets.DONMUSE_STORE_PASSWORD }}
          DONMUSE_KEY_ALIAS: ${{ secrets.DONMUSE_KEY_ALIAS }}
          DONMUSE_KEY_PASSWORD: ${{ secrets.DONMUSE_KEY_PASSWORD }}
        run: |
          if [ -n "${DONMUSE_KEYSTORE_B64:-}" ] && [ -n "${DONMUSE_STORE_PASSWORD:-}" ] && [ -n "${DONMUSE_KEY_ALIAS:-}" ] && [ -n "${DONMUSE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$DONMUSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/donmuse-release.jks"
            echo "DONMUSE_KEYSTORE=$RUNNER_TEMP/donmuse-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile Kotlin and build APKs
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Surface compiler diagnostics as annotations
        if: failure() && hashFiles('android/build.log') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('android/build.log').read_text(errors='replace').splitlines()
          selected = [l for l in lines if l.startswith('e:') or 'What went wrong' in l or 'Could not ' in l or 'Execution failed' in l or l.startswith('Caused by:')]
          for line in selected[-60:]:
              print('::error title=Gradle build::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: android/build.log
          if-no-files-found: ignore
      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Label artifacts honestly
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DON-MUSE-debug.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/DON-MUSE-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/DON-MUSE-release-DEV-SIGNED.apk
          fi
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v7
        with:
          name: don-muse-apks
          path: artifacts/*.apk
          if-no-files-found: error
      - name: Attach APKs to rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: DON MUSE — latest APK
          body: |
            Built from main with the UI bundled locally. Debug APK is installable for testing.
            Release is production-signed only when all DONMUSE_KEYSTORE_B64, DONMUSE_STORE_PASSWORD,
            DONMUSE_KEY_ALIAS and DONMUSE_KEY_PASSWORD secrets are configured; otherwise the
            artifact is explicitly named DEV-SIGNED and is not a production signature.
          files: artifacts/*.apk
