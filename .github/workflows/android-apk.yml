name: Build DON MUSE APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DONMUSE_KEYSTORE_B64: ${{ secrets.DONMUSE_KEYSTORE_B64 }}
    # NB: no job-wide working-directory. It used to be `android`, which silently
    # broke every repo-root-relative path used later (`/tmp` copies, artifact
    # globs). Steps that need the Android project cd into it explicitly.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Bundle the real web UI inside the APK so the app also opens with no
      # network (assets/www). The app falls back to the hosted build if absent.
      - name: Build web UI for bundling
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --ignore-scripts
          npm run build
          # Full offline bundle: every route rendered, every asset captured, and
          # the read-only API answers snapshotted so the app has real content
          # with no connection at all.
          node scripts/offline-bundle.mjs
          test -f out-offline/index.html || { echo "::error::Offline bundle missing index.html"; exit 1; }
          test -f out-offline/radio/index.html || { echo "::error::Offline bundle is missing routes"; exit 1; }
          test -d out-offline/api-snapshot || { echo "::error::Offline bundle has no api snapshots"; exit 1; }
          test -n "$(find out-offline/_next/static -type f -name '*.js' -print -quit)" || { echo "::error::Offline bundle has no JavaScript chunks"; exit 1; }
          test -n "$(find out-offline/_next/static -type f -name '*.css' -print -quit)" || { echo "::error::Offline bundle has no CSS chunks"; exit 1; }
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r out-offline android/app/src/main/assets/www
          test -n "$(find android/app/src/main/assets/www/_next/static -type f -name '*.js' -print -quit)" || { echo "::error::Next.js JavaScript chunks were not copied"; exit 1; }
          test -n "$(find android/app/src/main/assets/www/_next/static -type f -name '*.css' -print -quit)" || { echo "::error::Next.js CSS chunks were not copied"; exit 1; }
          echo "bundled $(find android/app/src/main/assets/www -type f | wc -l) files into assets/www"

      # Install the SDK explicitly: the runner's default image no longer
      # guarantees a cmdline-tools layout that `setup-android` can extend, and a
      # silent failure there skips the whole APK build.
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: true

      # The repo carries only gradle-wrapper.properties, so the wrapper is
      # generated on CI where Gradle is available (no committed jar needed).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Gradle version
        working-directory: android
        run: gradle --version

      # A *stable* signing key. The default Android debug keystore is generated
      # per machine, so two CI runs produce differently signed APKs and Android
      # silently refuses to update an installed app. Generating one keystore with
      # fixed parameters makes every build install over the previous one.
      - name: Prepare a stable signing key
        working-directory: android
        run: |
          set -euo pipefail
          if [ -n "${DONMUSE_KEYSTORE_B64:-}" ]; then
            echo "$DONMUSE_KEYSTORE_B64" | base64 -d > app/donmuse-release.jks
            echo "DONMUSE_KEYSTORE=$PWD/app/donmuse-release.jks" >> "$GITHUB_ENV"
            echo "using the project keystore from secrets"
          else
            keytool -genkeypair -v \
              -keystore app/donmuse-release.jks \
              -alias donmuse -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass donmuse -keypass donmuse \
              -dname "CN=DON MUSE, OU=Mobile, O=DON MUSE, L=Cairo, C=EG"
            echo "DONMUSE_KEYSTORE=$PWD/app/donmuse-release.jks" >> "$GITHUB_ENV"
            echo "generated the fixed-parameter project keystore"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          # Prefer the dedicated app host, then reuse the API origin already
          # configured for the static web export.
          DONMUSE_WEB_HOST: ${{ vars.DONMUSE_WEB_HOST || vars.NEXT_PUBLIC_API_BASE }}
        run: |
          # Surface the real compiler error as a check annotation: job logs live on
          # blob storage that some environments cannot reach, annotations do not.
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            errs=$(grep -E "^e: |error:|FAILURE:|What went wrong|Caused by" /tmp/gradle.log | tail -25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            echo "::error title=Gradle build failed::$errs"
            exit 1
          fi

      - name: Build release APK (signed when secrets exist, else debug-signed)
        working-directory: android
        env:
          DONMUSE_STORE_PASSWORD: ${{ secrets.DONMUSE_STORE_PASSWORD || 'donmuse' }}
          DONMUSE_KEY_ALIAS: ${{ secrets.DONMUSE_KEY_ALIAS || 'donmuse' }}
          DONMUSE_KEY_PASSWORD: ${{ secrets.DONMUSE_KEY_PASSWORD || 'donmuse' }}
        run: |
          set -euo pipefail
          set -o pipefail
          if ! gradle :app:assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-release.log; then
            errs=$(grep -E "^e: |error:|FAILURE:|What went wrong|Caused by|Execution failed" /tmp/gradle-release.log | tail -25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            echo "::error title=Release APK failed::$errs"
            exit 1
          fi

      - name: Verify UI files inside both APKs
        run: |
          python3 - <<'PY'
          import zipfile

          apks = {
              "debug": "android/app/build/outputs/apk/debug/app-debug.apk",
              "release": "android/app/build/outputs/apk/release/app-release.apk",
          }
          required = (
              "assets/www/index.html",
              "assets/www/radio/index.html",
              "assets/www/quran/index.html",
              "assets/www/settings/index.html",
              "assets/www/api-snapshot/index.json",
          )
          for kind, apk_path in apks.items():
              with zipfile.ZipFile(apk_path) as apk:
                  names = set(apk.namelist())
              missing = [path for path in required if path not in names]
              js = [name for name in names if name.startswith("assets/www/_next/static/") and name.endswith(".js")]
              css = [name for name in names if name.startswith("assets/www/_next/static/") and name.endswith(".css")]
              if missing or not js or not css:
                  raise SystemExit(
                      f"::error::{kind} APK is incomplete: missing={missing}, JS chunks={len(js)}, CSS chunks={len(css)}"
                  )
              print(f"{kind}: offline screens OK · {len(js)} JS chunks · {len(css)} CSS files")
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: don-muse-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      # Stable, guessable file names so a direct download link never changes.
      - name: Name the APKs
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-out
          for kind in debug release; do
            f=$(ls android/app/build/outputs/apk/$kind/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$f" ]; then
              echo "::error title=APK missing::no $kind APK was produced"
              exit 1
            fi
            cp "$f" "/tmp/apk-out/don-muse-$kind.apk"
          done
          ls -l /tmp/apk-out

      # Publish on every branch build (not just main) so the branch that is being
      # tested always has a downloadable APK. `make_latest: false` keeps a branch
      # build from claiming "latest".
      - name: Publish APKs to a rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DON MUSE — latest APK
          make_latest: false
          body: |
            Automatically built APK, rebuilt from `${{ github.ref_name }}` on every push.

            * `don-muse-debug.apk` — debug-signed, installs anywhere
            * `don-muse-release.apk` — release build (debug-signed unless keystore secrets are set)
          files: |
            /tmp/apk-out/don-muse-debug.apk
            /tmp/apk-out/don-muse-release.apk
          fail_on_unmatched_files: true
