name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly refresh so data snapshots stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ffmpeg-static's postinstall cannot be verified inside some CI sandboxes;
      # the app only needs the binary at runtime, which is present in the package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Export static site for Pages
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: |
          set -euo pipefail
          node scripts/gh-pages-export.mjs
          test -f out/index.html || { echo "::error::Static export produced no index.html"; exit 1; }

      # Relative asset URLs mean the site works at the domain root and under
      # /<repo>/ without a custom basePath.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
