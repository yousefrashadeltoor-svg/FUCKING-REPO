name: Verify and build DON MUSE

# One honest pipeline: typecheck → lint → web build → static export → APK with the
# web UI bundled inside → artifacts. The previous version auto-committed to main
# and applied an opaque binary patch; both are gone.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: don-muse-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (errors fail, warnings reported)
        run: npm run lint -- --max-warnings=400

      - name: Next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Static export for bundling into the APK
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          node scripts/gh-pages-export.mjs
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          echo "exported $(find out -type f | wc -l) files"

      - name: Upload static export
        uses: actions/upload-artifact@v5
        with:
          name: don-muse-web-export
          path: out
          retention-days: 7

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: true

      # Pin the Gradle *distribution*: the runner's default can be newer than
      # AGP 8.5.2 supports, and `gradle wrapper` then fails on the settings script.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Download the web export
        uses: actions/download-artifact@v6
        with:
          name: don-muse-web-export
          path: out

      - name: Bundle the web UI into the APK assets
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::Web export missing"; exit 1; }
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r out android/app/src/main/assets/www
          echo "bundled $(find android/app/src/main/assets/www -type f | wc -l) files"

      - name: Generate Gradle wrapper when missing
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug + release APKs
        working-directory: android
        env:
          DONMUSE_WEB_HOST: ${{ vars.DONMUSE_WEB_HOST }}
          DONMUSE_KEYSTORE_B64: ${{ secrets.DONMUSE_KEYSTORE_B64 }}
          DONMUSE_STORE_PASSWORD: ${{ secrets.DONMUSE_STORE_PASSWORD }}
          DONMUSE_KEY_ALIAS: ${{ secrets.DONMUSE_KEY_ALIAS }}
          DONMUSE_KEY_PASSWORD: ${{ secrets.DONMUSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${DONMUSE_KEYSTORE_B64:-}" ]; then
            echo "$DONMUSE_KEYSTORE_B64" | base64 -d > app/donmuse-release.jks
            echo "DONMUSE_KEYSTORE=$PWD/app/donmuse-release.jks" >> "$GITHUB_ENV"
          fi
          if ! ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            errs=$(grep -E "^e: |error:|FAILURE:|What went wrong|Caused by|Execution failed" /tmp/gradle.log | tail -25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            echo "::error title=APK build failed::$errs"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: don-muse-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
